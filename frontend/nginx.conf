server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vue Router uses history mode (createWebHistory) — a hard refresh or deep link on
    # e.g. /hotels/12 is a real request to that path, which nginx has no file for. Falling
    # back to index.html lets the SPA's own router take over and resolve it client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
}
