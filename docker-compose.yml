version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: hotel_db
    environment:
      POSTGRES_DB: hotel_db
      POSTGRES_USER: hotel_user
      POSTGRES_PASSWORD: hotel_pass
    ports:
      - "5432:5432"
    volumes:
      - hotel_db_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  hotel_db_data: