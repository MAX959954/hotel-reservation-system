spring:
  datasource:
    # Testcontainers JDBC URL: the first connection starts a throwaway PostgreSQL 16
    # container (Docker must be running), shared by every Spring context in the test run
    # (TC_DAEMON) and removed afterwards. Same database engine as production, so tests
    # catch what H2 used to hide (PostgreSQL-specific SQL, constraints, types).
    url: jdbc:tc:postgresql:16-alpine:///hotel_test?TC_DAEMON=true
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
    username: test
    password: test

  jpa:
    hibernate:
      # Schema comes from the real Flyway migrations (spring.flyway in application.yml);
      # Hibernate only checks that the entities match it - exactly as in production.
      ddl-auto: validate
    show-sql: false

jwt:
  secret: JGIyW31SVJyNNn5NGlMrb3rsJ2DV1/QYTRJSZjpcJa8=
  expiration: 86400000

app:
  # Scheduled jobs (BookingLifecycleScheduler, PaymentLifecycleScheduler) run on their
  # own thread outside any test's transaction — leaving them on here would let a
  # background tick mutate rows mid-test, or race an in-progress test transaction on the
  # same database. Every @SpringBootTest boots the full context, so this has to be
  # off by default for the whole test profile, not opted out per test.
  scheduling:
    enabled: false
