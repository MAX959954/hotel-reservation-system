# Activated with SPRING_PROFILES_ACTIVE=prod (set this in Railway/whatever PaaS you
# deploy to — the local Docker Compose workflow uses the "local" profile instead, see
# application-local.yml). Only overrides what actually needs to differ; everything else
# keeps inheriting from application.yml. config.ProductionSafetyCheck additionally
# refuses to start this profile with local-development settings (dev JWT key, codes in
# the log).

# E-mail over SMTP (app.mail.provider=smtp, the default in deploy/docker-compose.prod.yml),
# e.g. Gmail with an app password: host smtp.gmail.com, port 587, STARTTLS. SendGrid's
# HTTP API remains available with MAIL_PROVIDER=sendgrid (it no longer has a free plan).
spring:
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

# An unreachable mail server must not mark the whole API unhealthy (that would make the
# deploy script / Docker healthcheck treat a working site as down).
management:
  health:
    mail:
      enabled: false

cors:
  # No fallback here on purpose, unlike the base file's localhost default — an unset
  # CORS_ALLOWED_ORIGINS in prod should fail the deploy loudly (Spring refuses to start:
  # "Could not resolve placeholder") rather than silently leave CORS on a value that can
  # only ever match a browser on the machine running the container.
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

logging:
  level:
    root: INFO
    # These three are the chattiest loggers in a normal request/startup path and add
    # little beyond what root:INFO already gives you — Hibernate's own SQL logging is
    # separately gated by spring.jpa.show-sql anyway (see application.yml).
    org.hibernate: WARN
    org.springframework.web: WARN
    com.zaxxer.hikari: WARN
