spring:
  application:
    name: Hotel-system

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:hotel_db}
    username: ${POSTGRES_USER:hotel_user}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Local dev's Redis has no password; managed Redis on a host like Railway always
      # does. Blank-safe the same way the datasource/SMTP settings above are.
      password: ${REDIS_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  # Railway (and most PaaS hosts) assign the listen port at runtime via $PORT rather than
  # letting you pick one — 8080 stays the default for local/Docker Compose, where nothing
  # sets that variable.
  port: ${PORT:8080}

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174}

app:
  mail:
    from: ${MAIL_FROM:}
  otp:
    expiry-minutes: 10
    resend-cooldown-seconds: 30
  uploads:
    dir: ${UPLOADS_DIR:/app/uploads}

google:
  oauth:
    client-id: ${GOOGLE_CLIENT_ID:}

stripe:
  # Blank-safe like the SMTP settings above: an empty key only breaks the specific request
  # that needs Stripe (create/confirm payment), not application startup — so contextLoads()
  # and any test that boots the full context still work without a real key configured.
  secret-key: ${STRIPE_SECRET_KEY:}
