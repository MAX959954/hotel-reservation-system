spring:
  application:
    name: Hotel-system

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:hotel_db}
    username: ${POSTGRES_USER:hotel_user}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Local dev's Redis has no password; managed Redis on a host like Railway always
      # does. Blank-safe the same way the datasource settings above are.
      password: ${REDIS_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

server:
  # Railway (and most PaaS hosts) assign the listen port at runtime via $PORT rather than
  # letting you pick one — 8080 stays the default for local/Docker Compose, where nothing
  # sets that variable.
  port: ${PORT:8080}

jwt:
  secret: ${JWT_SECRET}
  # Short on purpose now that refresh tokens exist (see RefreshTokenService) to sustain
  # a session past this — a leaked access token that's only good for 15 minutes is a much
  # smaller window than the 24h this used to default to, and refresh-expiration-days below
  # is what actually decides how long someone stays signed in.
  expiration: ${JWT_EXPIRATION:900000}
  refresh-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS:30}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174}

app:
  mail:
    from: ${MAIL_FROM:}
  otp:
    expiry-minutes: 10
    resend-cooldown-seconds: 30
  login:
    # Brute-force protection on the password check in UserServiceImpl.login — OTP itself
    # is already separately rate-limited (see OtpService.MAX_REQUESTS_PER_HOUR), so this
    # is specifically about guessing the first factor.
    max-failed-attempts: ${LOGIN_MAX_FAILED_ATTEMPTS:5}
    lockout-minutes: ${LOGIN_LOCKOUT_MINUTES:15}
  uploads:
    dir: ${UPLOADS_DIR:/app/uploads}
  scheduling:
    # Off switch for BookingLifecycleScheduler/PaymentLifecycleScheduler as a whole —
    # the test profile sets this to false so background ticks can't mutate rows outside
    # any test's transaction.
    enabled: ${SCHEDULING_ENABLED:true}
  bookings:
    # This model requires staff to confirm a booking request (see
    # BookingController.confirm) — PENDING means "awaiting someone's action", not
    # "processing", so it can legitimately sit for a while. But it still blocks the room
    # for those dates (findOverlappingBookings only excludes CANCELLED/PAYMENT_FAILED),
    # so it can't be left open forever either.
    pending-hold-hours: ${BOOKING_PENDING_HOLD_HOURS:48}
    # Grace period after check-in time before an unshown CONFIRMED booking is flagged
    # NO_SHOW — guards against flagging a guest who's simply arriving later the same day.
    no-show-grace-hours: ${BOOKING_NO_SHOW_GRACE_HOURS:6}
  payments:
    # How long a PENDING payment (a Stripe PaymentIntent the guest never finished, or
    # abandoned before 3DS/redirect completed) sits before it's marked EXPIRED.
    pending-expiry-hours: ${PAYMENT_PENDING_EXPIRY_HOURS:24}

sendgrid:
  # Blank-safe like stripe.secret-key below: an empty key only breaks the specific email
  # send, not application startup.
  api-key: ${SENDGRID_API_KEY:}

google:
  oauth:
    client-id: ${GOOGLE_CLIENT_ID:}

stripe:
  # Blank-safe like sendgrid.api-key above: an empty key only breaks the specific request
  # that needs Stripe (create/confirm payment), not application startup — so contextLoads()
  # and any test that boots the full context still work without a real key configured.
  secret-key: ${STRIPE_SECRET_KEY:}
  # Signing secret for the /api/payments/webhook endpoint (Stripe CLI/Dashboard gives you
  # one per webhook destination, starts with "whsec_"). Blank-safe for the same reason —
  # an unconfigured secret only fails signature verification on an actual webhook call.
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
